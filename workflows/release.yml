name: Release binaries

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ferrum-linux-x86_64.tar.gz
            binary: ferrum
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ferrum-windows-x86_64.zip
            binary: ferrum.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: ferrum-macos-x86_64.tar.gz
            binary: ferrum
          - os: macos-15
            target: aarch64-apple-darwin
            archive: ferrum-macos-aarch64.tar.gz
            binary: ferrum

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          overwrite_files: true
          files: ${{ matrix.archive }}
